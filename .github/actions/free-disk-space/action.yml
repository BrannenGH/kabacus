name: Free disk space
description: >-
  Removes toolchains this project doesn't use from a GitHub-hosted Ubuntu
  runner, so the test images and Rust builds fit on its disk.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /
