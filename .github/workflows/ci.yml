name: CI

# A change can only be merged when all of these pass. Pushes to master
# aren't tested again: the Release and RPM repository workflows build and
# publish them (tests don't gate publishing).
# Everything runs in the openSUSE Tumbleweed test containers from the
# Containerfile (scripts/dev), the same ones used locally, with the
# runner's podman. They carry the pinned hledger (for the comparison tests)
# and the test tools.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the run before it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What the pull request touches, so the server image and the DEB (the
  # slow builds) only run when it could change them. By hand: everything.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      server: ${{ steps.diff.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files="$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo ALL)"
          touches() { echo "$files" | grep -qE "^ALL$|$1" && echo true || echo false; }
          echo "app=$(touches '^(crates/(kabacus-kde|kabacus-client|kabacus-core|kabacus-service|kabacus-store|kabacus-mcp|kabacus-cli)/|Cargo\.(toml|lock)$|po/|design/|packaging/|xtask/|scripts/(build-packages|package-version|dev)$|Containerfile$)')" >> "$GITHUB_OUTPUT"
          echo "server=$(touches '^(crates/(kabacus-server|kabacus-service|kabacus-store|kabacus-ledger|kabacus-core)/|Cargo\.(toml|lock)$|Containerfile$|container/|scripts/build-image$|apps/kabacus-ui/)')" >> "$GITHUB_OUTPUT"

  # Every file states its copyright and licence (REUSE.toml, LICENSES/), as
  # KDE's licensing policy asks. The REUSE project's own image, pinned to
  # the version the repository was checked with.
  reuse:
    name: licensing (reuse lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reuse lint
        run: podman run --rm --volume "$PWD:/data:Z" docker.io/fsfe/reuse:6.2.0 lint

  # Every statically linked dependency ends up in the binaries, so each
  # one's licence must be on deny.toml's allow-list. Built once
  # into the cached cargo home of the test container.
  licenses:
    name: dependency licences (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - name: cargo deny check licenses
        run: >-
          scripts/dev sh -c 'cargo install --locked --version 0.18.4 cargo-deny
          && PATH="$CARGO_HOME/bin:$PATH" cargo deny check licenses'

  rust:
    name: fmt, clippy, tests, design check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space

      - name: Build the openSUSE test image
        run: scripts/dev hledger --version

      - name: cargo fmt --check
        run: scripts/dev cargo fmt --all --check

      - name: cargo clippy
        run: scripts/dev cargo clippy --workspace --all-targets -- -D warnings

      # Unit, integration and MCP e2e all run under plain `cargo test` in
      # this workspace, on SQLite stores. The image has the pinned hledger
      # and a PostgreSQL server, so the comparison with hledger and the
      # store suite on PostgreSQL must run. Line tables only: backtraces
      # keep file and line, and each test binary is under half the size.
      - name: cargo test --workspace
        run: >-
          scripts/dev env CARGO_PROFILE_DEV_DEBUG=line-tables-only KABACUS_REQUIRE_HLEDGER=1 KABACUS_REQUIRE_POSTGRES=1
          cargo test --workspace

      # Fails if po/ is out of date with the app's messages, or a
      # translation doesn't fit its English text (placeholders, plurals).
      - name: xtask i18n-extract --check
        run: >-
          scripts/dev env CARGO_PROFILE_DEV_DEBUG=line-tables-only
          cargo run -p xtask -- i18n-extract --check

      # Fails if design/generated/Theme.qml is out of date with
      # design/tokens.json.
      - name: design/generate --check
        run: >-
          scripts/dev env CARGO_PROFILE_DEV_DEBUG=line-tables-only
          cargo run -p xtask -- design-generate --check

  # The app built against the container's Qt 6 and Kirigami,
  # driven through AT-SPI on Xvfb.
  gui-e2e:
    name: qmllint, GUI e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      # The QML against the bridge's types and the container's Qt and
      # Kirigami; fails on any warning.
      - name: qmllint
        run: scripts/dev --gui scripts/qmllint
      - name: GUI e2e
        run: scripts/gui-e2e

  # The redistributable server image builds, when the server could have
  # changed.
  server-image:
    name: server image
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - run: scripts/build-image

  # The app's DEB builds, uploaded as the run's `deb` artifact to download
  # and try, when the app could have changed. RPMs aren't built on pull
  # requests: the RPM repository workflow builds them on master.
  packages:
    name: packages
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/packages.yml
    with:
      kinds: '["deb"]'


  web:
    name: React build and desktop browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable engine
        run: |
          podman build --build-arg SOURCE_COMMIT="${{ github.sha }}" --target wasm -t localhost/kabacus-wasm -f Containerfile .
          podman run --rm --volume "$PWD/apps/kabacus-ui/public:/out:Z" localhost/kabacus-wasm sh -c 'cp -r /src/apps/kabacus-ui/public/wasm /out/'
      - name: Build and test the React interface
        run: >-
          podman run --rm --ipc=host --volume "$PWD:/work:Z"
          --workdir /work/apps/kabacus-ui
          mcr.microsoft.com/playwright:v1.56.1-noble
          sh -c 'npm ci && npm test && npm run build && npm run test:e2e'

  tauri:
    name: Tauri build, URL validation and window smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk-space
      - name: Build the native test image
        run: podman build --build-arg SOURCE_COMMIT="${{ github.sha }}" --target tauri-test -t localhost/kabacus-tauri-test -f Containerfile .
      - name: Compile and test the native shell
        run: >-
          podman run --rm --volume "$PWD:/work:Z" --workdir /work
          --env CARGO_BUILD_JOBS=2 --env CARGO_PROFILE_DEV_DEBUG=0
          localhost/kabacus-tauri-test
          sh -c 'scripts/build-desktop-cli && cd apps/kabacus-ui && cp -r /opt/kabacus-wasm public/wasm && npm ci && npm run build
          && cargo fmt --manifest-path src-tauri/Cargo.toml --check
          && cargo test --manifest-path src-tauri/Cargo.toml --locked
          && cargo build --manifest-path src-tauri/Cargo.toml --locked
          && WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 GTK_A11Y=always
          dbus-run-session -- xvfb-run -a python3 tests/native_smoke.py src-tauri/target/debug/kabacus-desktop'
