[workspace]
resolver = "2"
members = [
    "crates/kabacus-core",
    "crates/kabacus-ledger",
    "crates/kabacus-store",
    "crates/kabacus-server",
    "crates/kabacus-client",
    "crates/kabacus-testkit",
    "crates/kabacus-kde",
    "xtask",
]
# kabacus-kde's Qt UI is behind its `gui` feature, so the workspace builds
# and tests without Qt. See crates/kabacus-kde/README.md.

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/BrannenGH/kabacus"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
proptest = "1"
chrono = { version = "0.4", features = ["serde"] }
num-bigint = "0.4"
num-traits = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-journald = "0.3"
