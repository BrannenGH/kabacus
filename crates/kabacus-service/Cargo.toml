[package]
name = "kabacus-service"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
kabacus-core = { path = "../kabacus-core" }
kabacus-ledger = { path = "../kabacus-ledger" }
kabacus-store = { path = "../kabacus-store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
base64 = "0.22"
regex = "1"
serde_urlencoded = "0.7"
percent-encoding = "2"
schemars = { version = "1.2", features = ["chrono04"] }

url = "2"
uuid = { version = "1", features = ["v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Headers", "Request", "RequestCredentials", "RequestInit", "RequestMode", "RequestRedirect", "Response", "Window"] }

[dev-dependencies]
tokio.workspace = true
