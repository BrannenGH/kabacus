[package]
name = "kabacus-store"
version.workspace = true
edition.workspace = true
repository.workspace = true
# A shared library, GPL like the others; only kabacus-server is AGPL.
license = "GPL-3.0-or-later"

[dependencies]
kabacus-core = { path = "../kabacus-core" }
kabacus-ledger = { path = "../kabacus-ledger" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
num-bigint = { workspace = true }
tracing = { workspace = true }
# The local and self-hosted store, and the .kabacus file (bundled, so no
# system SQLite is needed).
rusqlite = { version = "0.40.1", features = ["backup", "serialize", "fallible_uint"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
rusqlite = { version = "0.40.1", features = ["bundled", "backup", "serialize", "fallible_uint"] }
tempfile = "3"

# PostgreSQL belongs to the hosted service. Mobile clients use SQLite or
# connect through HTTPS; its desktop host-identity APIs are unavailable on iOS.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
tokio-postgres = "0.7"
deadpool-postgres = "0.14"

[features]
# Throwaway PostgreSQL databases for tests.
testing = []

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
kabacus-store = { path = ".", features = ["testing"] }
proptest = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
