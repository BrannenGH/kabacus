# Every statically linked dependency ends up in the binaries, which are
# GPL-3.0-or-later (apps and shared libraries) and AGPL-3.0-or-later
# (server). Only licences compatible with both are allowed; GPL-2.0-only
# is not.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9
