[package]
name = "kabacus-desktop"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Kept separate so server builds do not require platform WebView libraries.
[workspace]

# The mobile builds load the shell as a library.
[lib]
name = "kabacus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"
kabacus-client = { path = "../../../crates/kabacus-client" }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

kabacus-service = { path = "../../../crates/kabacus-service" }
kabacus-store = { path = "../../../crates/kabacus-store" }
tokio = { version = "1", features = ["time"] }

# The Secret Service keyring, which only Linux has.
[target.'cfg(target_os = "linux")'.dependencies]
kabacus-kde = { path = "../../../crates/kabacus-kde", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
