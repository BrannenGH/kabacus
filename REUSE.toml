# Licences for the files that can't carry a header of their own. Every
# other file states its licence in an SPDX header; `reuse lint` checks
# them all (REUSE 3.3, as KDE projects use).
version = 1
SPDX-PackageName = "kabacus"
SPDX-PackageSupplier = "Brannen Hall <brannen@hallb.me>"
SPDX-PackageDownloadLocation = "https://github.com/BrannenGH/kabacus"

# Served verbatim to MCP clients and compiled into the server, so no header.
[[annotations]]
path = "crates/kabacus-server/skills/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Brannen Hall <brannen@hallb.me>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated by `cargo xtask design-generate`; the second is a symlink.
[[annotations]]
path = ["design/generated/Theme.qml", "crates/kabacus-kde/qml/Theme.qml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Brannen Hall <brannen@hallb.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Data and configuration without comments: JSON, the lock file, the
# synthetic test key, Claude Code's project settings, and the
# .dockerignore symlink.
[[annotations]]
path = [
    "Cargo.lock",
    "design/tokens.json",
    ".vscode/**",
    ".claude/settings.json",
    "crates/kabacus-server/tests/fixtures/**",
    ".dockerignore",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Brannen Hall <brannen@hallb.me>"
SPDX-License-Identifier = "CC0-1.0"

# The translations: the template is generated by `cargo xtask i18n-extract`,
# which also rewrites the catalogs, so they carry no header of their own.
[[annotations]]
path = "po/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Brannen Hall <brannen@hallb.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"


[[annotations]]
path = ["apps/kabacus-ui/package.json", "apps/kabacus-ui/package-lock.json", "apps/kabacus-ui/src-tauri/tauri.conf.json", "apps/kabacus-ui/src-tauri/tauri.*.conf.json", "apps/kabacus-ui/src-tauri/Cargo.lock"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Brannen Hall <brannen@hallb.me>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["apps/kabacus-ui/src-tauri/icons/icon.png", "packaging/desktop/me.hallb.kabacus.svg", "apps/kabacus-ui/src/icon.svg", "apps/kabacus-ui/public/icon.svg", "apps/kabacus-ui/public/apple-touch-icon.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Brannen Hall <brannen@hallb.me>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "crates/kabacus-mcp/skills/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Brannen Hall <brannen@hallb.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "apps/kabacus-ui/public/manifest.webmanifest"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Brannen Hall <brannen@hallb.me>"
SPDX-License-Identifier = "CC0-1.0"
